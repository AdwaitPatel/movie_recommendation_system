<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Film reel stripes -->
  <circle cx="50" cy="50" r="45" fill="#1f2937" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#4f46e5" stroke-width="1.5"/>
  
  <!-- Film strip holes -->
  <rect x="15" y="45" width="4" height="10" fill="#4f46e5" rx="1"/>
  <rect x="81" y="45" width="4" height="10" fill="#4f46e5" rx="1"/>
  <rect x="45" y="15" width="10" height="4" fill="#4f46e5" rx="1"/>
  <rect x="45" y="81" width="10" height="4" fill="#4f46e5" rx="1"/>
  
  <!-- Center play button -->
  <circle cx="50" cy="50" r="20" fill="#4f46e5"/>
  <polygon points="44,42 44,58 62,50" fill="white"/>
  
  <!-- Accent corners -->
  <circle cx="50" cy="50" r="3" fill="#fbbf24"/>
</svg>